name: Check

on:
  push:
    branches: [main, codex/beginner-starter]
  pull_request:
  workflow_dispatch:
    inputs:
      show_azure_oidc:
        description: '初期設定用: Azureへ登録するOIDC接続情報だけ表示する（公開・デプロイしない）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  # A newer PR check may replace an older one; do not interrupt a deployment from the team default branch.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  oidc-setup:
    if: github.event_name == 'workflow_dispatch' && inputs.show_azure_oidc && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      id-token: write
    steps:
      - name: Show the actual Azure federation values without exposing the token
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const requestURL = new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          requestURL.searchParams.set('audience', 'api://AzureADTokenExchange');
          const response = await fetch(requestURL, {
            headers: { Authorization: `Bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
          });
          if (!response.ok) throw new Error(`OIDC request failed: HTTP ${response.status}`);
          const { value: token } = await response.json();
          if (typeof token !== 'string') throw new Error('OIDC response did not contain a token');
          const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
          const values = { Issuer: claims.iss, Subject: claims.sub, Audience: claims.aud };
          for (const [name, value] of Object.entries(values)) {
            if (typeof value !== 'string' || !value || /[\r\n`]/.test(value)) {
              throw new Error(`Unexpected OIDC ${name} format`);
            }
          }
          const summary = [
            '### Azure OIDC setup',
            'Azure portalのFederated credentials → Other issuerへ、次の値をそのまま登録します。',
            '',
            ...Object.entries(values).map(([name, value]) => `${name}: \`${value}\``),
            '',
            'Environment: `production`。トークンそのものは表示・保存していません。',
          ];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join('\n\n') + '\n');
          NODE

  check:
    if: github.event_name != 'workflow_dispatch' || !inputs.show_azure_oidc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOCAL_IMAGE: student-hackathon:${{ github.sha }}
    steps:
      - name: Check publish and deploy switches
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.ENABLE_AZURE_DEPLOY == 'true' && vars.ENABLE_CONTAINER_PUBLISH != 'true'
        run: |
          echo '::error::Azure deployment requires ENABLE_CONTAINER_PUBLISH=true as well. See handson/azure.md.'
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Build the production container
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=$REPOSITORY_URL" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$LOCAL_IMAGE" .
      - name: Start the production container
        run: docker run --detach --name app-under-test --publish 127.0.0.1:4281:8080 "$LOCAL_IMAGE"
      - name: Wait for the API
        run: |
          for _attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4281/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs app-under-test
          exit 1
      - name: Test the running production container
        id: browser-tests
        env:
          E2E_BASE_URL: http://127.0.0.1:4281
        run: npm run test:e2e
      - name: Save browser test failure evidence
        if: failure() && steps.browser-tests.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure-evidence
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
      - name: Container logs
        if: failure()
        run: docker logs app-under-test || true
      - name: Stop the container
        if: always()
        run: docker rm --force app-under-test || true
      - name: Save the tested image for publishing
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.ENABLE_CONTAINER_PUBLISH == 'true'
        run: docker save --output "$RUNNER_TEMP/tested-image.tar" "$LOCAL_IMAGE"
      - name: Upload the tested image
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.ENABLE_CONTAINER_PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-image
          path: ${{ runner.temp }}/tested-image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: check
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.ENABLE_CONTAINER_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-image
          path: ${{ runner.temp }}/tested-image
      - name: Load the tested image without rebuilding
        run: docker load --input "$RUNNER_TEMP/tested-image/tested-image.tar"
      - name: Sign in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push the tested image and record its digest
        id: push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$GITHUB_SHA"
          docker tag "student-hackathon:$GITHUB_SHA" "$image"
          docker push "$image"
          digest_ref=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          echo "image=$digest_ref" >> "$GITHUB_OUTPUT"
          {
            echo '### Tested container image'
            echo "Tag: \`$image\`"
            echo "Deploy this digest: \`$digest_ref\`"
            echo 'For the first publish, make the GHCR package public before enabling Azure deployment. See handson/azure.md.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Sign out of the registry
        if: always()
        run: docker logout ghcr.io

  deploy:
    needs: publish
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.ENABLE_AZURE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      TESTED_IMAGE: ${{ needs.publish.outputs.image }}
    steps:
      - name: Check deployment settings
        run: |
          for setting in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_CONTAINER_APP_NAME; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Set the $setting Actions variable before enabling Azure deployment. See handson/azure.md."
              exit 1
            fi
          done
      - name: Check that Azure can pull the public image
        run: |
          if ! docker --config "$RUNNER_TEMP/anonymous-docker" manifest inspect "$TESTED_IMAGE" > /dev/null; then
            echo '::error::Make the GHCR package public before enabling Azure deployment. See handson/azure.md.'
            exit 1
          fi
      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy the tested digest to the existing Container App
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          mode=$(az containerapp show --name "$AZURE_CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.configuration.activeRevisionsMode --output tsv)
          if [[ "$mode" != 'Single' ]]; then
            echo '::error::Use Single revision mode for this starter. See handson/azure.md.'
            exit 1
          fi
          az containerapp update \
            --name "$AZURE_CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$TESTED_IMAGE" \
            --output none
          latest=$(az containerapp show --name "$AZURE_CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.latestRevisionName --output tsv)
          ready=false
          for _attempt in {1..60}; do
            latest_ready=$(az containerapp show --name "$AZURE_CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.latestReadyRevisionName --output tsv)
            if [[ "$latest_ready" == "$latest" ]]; then
              ready=true
              break
            fi
            sleep 5
          done
          if [[ "$ready" != true ]]; then
            echo "::error::Revision $latest did not become ready. Check the Container App revision logs."
            exit 1
          fi
          fqdn=$(az containerapp show --name "$AZURE_CONTAINER_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.configuration.ingress.fqdn --output tsv)
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "https://$fqdn/api/health"
          {
            echo '### Azure Container Apps'
            echo "URL: https://$fqdn"
            echo "Image: \`$TESTED_IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"
